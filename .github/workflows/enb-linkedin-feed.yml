name: ENB LinkedIn Feed

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if today's email was already sent"
        required: false
        default: false
        type: boolean
  schedule:
    # Five staggered attempts. Early runs wait until 14:30 AWST.
    - cron: "20 5 * * 1-5"
    - cron: "40 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "50 6 * * 1-5"

concurrency:
  group: enb-linkedin-feed-send
  cancel-in-progress: false
  queue: max

jobs:
  run-linkedin-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Log schedule trigger
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled cron: ${{ github.event.schedule }}"

      - name: Wait until 14:30 AWST
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          target_epoch=$(date -u -d "$(date -u +%F) 06:30:00" +%s)
          now_epoch=$(date -u +%s)
          if [ "$now_epoch" -lt "$target_epoch" ]; then
            sleep "$((target_epoch - now_epoch))"
          fi

      - name: Get Perth date
        id: perth-date
        shell: bash
        run: echo "date=$(TZ=Australia/Perth date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily send lock
        id: restore-lock
        uses: actions/cache/restore@v4
        with:
          path: .linkedin-feed-lock
          key: linkedin-feed-sent-${{ steps.perth-date.outputs.date }}

      - name: Check out repository
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        run: python -m pip install requests beautifulsoup4 openai

      - name: Run ENB LinkedIn feed
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python run_with_recipients.py linkedin
          mkdir -p .linkedin-feed-lock
          touch .linkedin-feed-lock/sent

      - name: Save daily send lock
        if: steps.restore-lock.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .linkedin-feed-lock
          key: linkedin-feed-sent-${{ steps.perth-date.outputs.date }}
