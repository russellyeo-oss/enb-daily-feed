name: Draft roundrobin email

# Proven ENB homepage date-card parser, scheduled for the 13:30 AWST
# roundrobin. Three independent GitHub cron attempts provide resilience;
# the per-day cache lock permits only one email to be sent.
on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if today's email was already sent"
        required: false
        default: false
        type: boolean
  schedule:
    # Australia/Perth is UTC+8 year-round.
    - cron: "30 5 * * 1-5"
    - cron: "35 5 * * 1-5"
    - cron: "40 5 * * 1-5"

concurrency:
  group: enb-daily-feed-send
  cancel-in-progress: false

jobs:
  run-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Log trigger
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled cron: ${{ github.event.schedule }}"

      - name: Get Perth date
        id: perth-date
        shell: bash
        run: echo "date=$(TZ=Australia/Perth date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily send lock
        id: restore-lock
        uses: actions/cache/restore@v4
        with:
          path: .daily-feed-lock
          key: daily-feed-sent-${{ steps.perth-date.outputs.date }}

      - name: Check out repository
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        run: python -m pip install requests beautifulsoup4

      - name: Run proven ENB daily story feed
        if: steps.restore-lock.outputs.cache-hit != 'true' || inputs.force_send == true
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
        run: |
          python run_with_recipients.py daily
          mkdir -p .daily-feed-lock
          touch .daily-feed-lock/sent

      - name: Save daily send lock
        if: steps.restore-lock.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .daily-feed-lock
          key: daily-feed-sent-${{ steps.perth-date.outputs.date }}
