name: ENB roundrobin collector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - roundrobin_collector.py
      - .github/workflows/roundrobin-collector.yml
      - roundrobin/trigger.txt
  schedule:
    # Australia/Perth is UTC+8 year-round. Start runners before the
    # 13:30 AWST cutoff so GitHub queue latency is absorbed before collection.
    # Scheduled runs wait internally until exactly 13:30. A 13:35 retry remains.
    - cron: "0,10,20,29,35 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: enb-roundrobin-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Wait for exact 13:30 AWST cutoff
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          target_epoch=$(date -u -d "$(date -u +%F) 05:30:00" +%s)
          now_epoch=$(date -u +%s)
          if [ "$now_epoch" -lt "$target_epoch" ]; then
            sleep "$((target_epoch - now_epoch))"
          fi

      - name: Collect complete ENB 13:30 snapshot
        id: collect
        shell: bash
        run: |
          set +e
          python roundrobin_collector.py \
            --cutoff-hour 13 \
            --cutoff-minute 30 \
            --output roundrobin/latest.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist latest snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roundrobin/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "Update ENB roundrobin snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce metadata audit
        if: steps.collect.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Collector found unresolved publication metadata. Snapshot was persisted for diagnosis."
          exit 1
